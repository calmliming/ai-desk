services:
  db:
    image: postgres:17-alpine
    container_name: aidesk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aidesk
      POSTGRES_PASSWORD: aidesk
      POSTGRES_DB: aidesk
    ports:
      - "5432:5432"
    volumes:
      - aidesk-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidesk -d aidesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aidesk-pgdata:
